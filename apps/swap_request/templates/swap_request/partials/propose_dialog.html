{% load lucide %}
<dialog id="propose-swap" class="market-dialog" aria-labelledby="swap-title">
  <button type="button" data-dialog-close class="absolute top-6 right-6 cursor-pointer text-neutral-80 sm:top-9 sm:right-9" aria-label="Close">{% lucide "x" size=24 %}</button>
  <div data-swap-content><h2 id="swap-title" class="font-display text-h4 text-primary-base">Propose a swap</h2></div>
  <p data-swap-status role="status" aria-live="polite" class="mt-3 text-b9 text-neutral-80"></p>
</dialog>

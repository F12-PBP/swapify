{% with exchange_status=swap_request.transaction.status %}
<span class="inline-flex shrink-0 items-center rounded-full px-3 py-2 text-b10 font-semibold {% if swap_request.status == 'accepted' and exchange_status == 'InProgress' %}bg-secondary-20 text-secondary-80{% elif swap_request.status == 'accepted' and exchange_status == 'Completed' %}bg-green-10 text-green-base{% elif swap_request.status == 'accepted' and exchange_status == 'Cancelled' or swap_request.status == 'accepted' and exchange_status == 'Disputed' %}bg-red-10 text-red-70{% elif swap_request.status == 'pending' %}bg-secondary-20 text-secondary-80{% elif swap_request.status == 'accepted' %}bg-green-10 text-green-base{% elif swap_request.status == 'rejected' %}bg-yellow-10 text-yellow-60{% else %}bg-red-10 text-red-70{% endif %}">{% if swap_request.status == 'accepted' and exchange_status and exchange_status != 'Waiting' %}{{ swap_request.transaction.get_status_display }}{% else %}{{ swap_request.get_status_display }}{% endif %}</span>
{% endwith %}

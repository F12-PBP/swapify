{% with owner=swap_request.requested_clothing.owner %}
<div class="flex flex-col gap-7 text-center" data-dialog-compact>
  <div class="flex flex-col gap-4">
    <h2 id="swap-title" tabindex="-1" class="font-display text-h4 text-primary-base outline-none">Your Request Sent!</h2>
    <p class="text-b8 text-neutral-80">Your request is on its way to <strong class="font-semibold text-neutral-90">{{ owner.profile.display_name|default:owner.username }}</strong>. You can chat and arrange the details once they accept your request.</p>
  </div>
  <div class="flex flex-col gap-3">
    <a class="market-button w-full" href="{% url 'swap_request:list' %}">Follow your swap</a>
    <a class="market-outline w-full" href="{% url 'clothing_catalog:list' %}" data-swap-keep-discovering>Keep discovering</a>
  </div>
</div>
{% endwith %}

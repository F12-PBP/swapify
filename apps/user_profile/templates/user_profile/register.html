{% extends "base.html" %}

{% block title %}Register | Swapify{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[70vh] max-w-md items-center px-4">
  <div class="card w-full bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-h3 font-display">Create your account</h1>
      <p class="text-sm opacity-70">Start swapping clothes with the Swapify community.</p>

      <form method="post" class="mt-4 space-y-4">
        {% csrf_token %}

        <label class="form-control w-full">
          <span class="label-text mb-1">Username</span>
          {{ form.username }}
          {% if form.username.help_text %}
            <span class="mt-1 text-xs opacity-70">{{ form.username.help_text }}</span>
          {% endif %}
          {% for error in form.username.errors %}
            <span class="mt-1 text-sm text-error">{{ error }}</span>
          {% endfor %}
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-1">Password</span>
          {{ form.password1 }}
          {% if form.password1.help_text %}
            <span class="mt-1 text-xs opacity-70">{{ form.password1.help_text }}</span>
          {% endif %}
          {% for error in form.password1.errors %}
            <span class="mt-1 text-sm text-error">{{ error }}</span>
          {% endfor %}
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-1">Confirm password</span>
          {{ form.password2 }}
          {% for error in form.password2.errors %}
            <span class="mt-1 text-sm text-error">{{ error }}</span>
          {% endfor %}
        </label>

        <button type="submit" class="btn btn-primary w-full">Register</button>
      </form>

      <p class="mt-2 text-center text-sm">
        Already have an account?
        <a class="link link-primary" href="{% url 'user_profile:login' %}">Login</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

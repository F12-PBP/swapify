<section aria-labelledby="palette-{{ palette.name }}" class="min-w-0 space-y-3">
     <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
          <h3 id="palette-{{ palette.name }}" class="text-sm font-bold text-neutral-120 sm:text-base">
               {{ palette.title }}
          </h3>
     </div>

     <div class="-mx-4 overflow-x-auto px-4 pb-2 sm:mx-0 sm:px-0" role="region" aria-label="Token warna {{ palette.title }}" tabindex="0">
          <div class="flex w-max gap-2 sm:w-full">
               {% for swatch in palette.swatches %}
                    <div
                         class="flex h-28 w-24 shrink-0 flex-col justify-end rounded-xl border border-neutral-120/5 p-2.5 text-xs sm:min-w-0 sm:flex-1 {% if swatch.light_text %}text-neutral-10{% else %}text-neutral-120{% endif %}"
                         style="background-color: var(--color-{{ palette.name }}-{{ swatch.token }});"
                    >
                         <span class="font-semibold">{{ swatch.token|title }}</span>
                         <span class="text-[11px] leading-tight">{{ swatch.hex }}</span>
                    </div>
               {% endfor %}
          </div>
     </div>
</section>

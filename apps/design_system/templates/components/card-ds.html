<article class="card min-w-0 border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body min-w-0 gap-5 p-4 sm:p-6">
        <div>
            <h2 class="card-title">
               {%block title%}
               {%endblock title%}
            </h2>
        </div>

        <div class="min-w-0">
               {%block preview%}
               {%endblock preview%}
        </div>

        <div class="min-w-0">
            <p class="mb-2 text-sm font-medium">
                Usage
            </p>
            <pre class="ds-code"><code>{%block code%}{%endblock code%}</code></pre>
        </div>
    </div>
</article>

{% load static lucide %}
<section id="hero" class="mx-auto w-full max-w-[1280px] px-5 sm:px-8 lg:px-14 pt-6 lg:pt-10" aria-labelledby="hero-title">
    <div class="relative isolate flex flex-col overflow-hidden rounded-[32px] border border-primary-20/60 bg-primary-10 px-6 pt-8 sm:px-10 sm:pt-10 lg:min-h-[620px] lg:flex-row lg:items-center lg:px-12 lg:py-16">
        <div class="motion-safe:animate-landing-arrive z-10 flex flex-col items-start gap-5 sm:gap-7 lg:w-[51%] lg:shrink-0">
            <h1 id="hero-title" class="text-[clamp(2.4rem,4.9vw,4rem)] leading-[1.04] tracking-[-0.055em] max-w-[550px] font-display font-medium text-primary-base">
                Your next favourite<br>
                is <em class="font-normal text-secondary-70">already<br class="hidden lg:block"> out there.</em>
            </h1>
            <p class="max-w-sm text-b8 leading-relaxed sm:text-b7 text-neutral-90 lg:text-b6">Swap pre-loved clothing with people near you. Better for your wardrobe, better for the planet.</p>
            <div class="flex flex-wrap gap-3">
                <a href="{% url 'clothing_catalog:list' %}" class="btn btn-primary gap-3">Explore clothing {% lucide "arrow-right" size=18 %}</a>
                <a href="#how-it-works" class="btn btn-primary-ghost">See how it works</a>
            </div>
        </div>
        <div class="bg-radial-[ellipse_at_50%_60%] from-primary-20 to-transparent to-70% translate-x-[var(--pointer-x,0px)] translate-y-[var(--pointer-y,0px)] transition-transform duration-600 ease-out motion-safe:animate-landing-scene motion-reduce:translate-none motion-reduce:transition-none relative mt-4 aspect-[1.12] w-full self-center lg:absolute lg:right-0 lg:bottom-8 lg:mt-0 lg:w-[53%]" data-hero-scene aria-label="Swapy waves hello among a shirt, jeans, and a denim jacket">
            <figure class="absolute flex flex-col items-center rounded-2xl border border-neutral-40 bg-neutral-10 p-2 shadow-lg top-[4%] left-[6%] w-[29%] -rotate-12">
                <img src="{% static 'images/landing_page/clothing/shirt.svg' %}" alt="A cream linen shirt" width="320" height="320" class="aspect-square w-full object-contain">
                <figcaption class="pb-1 font-display text-[9px] text-neutral-90 sm:text-b8">A lighter layer.</figcaption>
            </figure>
            <figure class="absolute flex flex-col items-center rounded-2xl border border-neutral-40 bg-neutral-10 p-2 shadow-lg top-0 right-[6%] w-[27%] rotate-12">
                <img src="{% static 'images/landing_page/clothing/jeans.svg' %}" alt="A pair of blue jeans" width="320" height="320" class="aspect-square w-full object-contain">
                <figcaption class="pb-1 font-display text-[9px] text-neutral-90 sm:text-b8">A perfect fit.</figcaption>
            </figure>
            <figure class="absolute flex flex-col items-center rounded-2xl border border-neutral-40 bg-neutral-10 p-2 shadow-lg right-[1%] bottom-[11%] w-[28%] rotate-[9deg]">
                <img src="{% static 'images/landing_page/clothing/jacket.svg' %}" alt="A pre-loved denim jacket" width="320" height="320" class="aspect-square w-full object-contain">
                <figcaption class="pb-1 font-display text-[9px] text-neutral-90 sm:text-b8">Another chapter.</figcaption>
            </figure>
            <img src="{% static 'images/landing_page/swapy/hello.svg' %}" alt="Swapy, the Swapify mascot, waving hello" width="340" height="380" fetchpriority="high" class="absolute bottom-[3%] left-[21%] w-[59%] drop-shadow-sm">
            <span class="absolute bottom-[6%] left-[7%] -rotate-6 font-display text-b7 italic text-secondary-70 sm:text-h5">Hello, new favourite.</span>
        </div>
    </div>
</section>

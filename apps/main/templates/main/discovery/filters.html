{% load static %}
<div class="mt-2 flex flex-wrap gap-3 border-b border-neutral-40 pb-5 sm:gap-4" aria-label="Clothing categories">
  <a href="{% querystring type=None page=None %}#finds" class="market-chip {% if not filters.type %}market-chip-active{% endif %}" {% if not filters.type %}aria-current="true"{% endif %}>All finds</a>
  {% for value, label in categories %}<a href="{% querystring type=value page=None %}#finds" class="market-chip {% if filters.type == value %}market-chip-active{% endif %}" {% if filters.type == value %}aria-current="true"{% endif %}>{{ label }}</a>{% endfor %}
</div>
<form method="get" action="{% url 'main:discover' %}#finds" class="my-2 flex flex-wrap items-center gap-3" aria-label="Filter and sort finds">
  <input type="hidden" name="search" value="{{ filters.search }}">
  <input type="hidden" name="type" value="{{ filters.type }}">
  {% include "main/discovery/filter_fields.html" with suffix="inline" %}
  <button class="market-secondary px-3 py-2 text-b9" type="submit" data-filter-apply>Apply</button>
  <button type="button" class="market-filter" data-dialog-open="catalog-filters" hidden>All filters</button>
  <div class="ml-auto flex items-center gap-2 text-b9 text-neutral-80">
    <label for="sort-finds">Sort by:</label>
    <select name="sort" id="sort-finds" class="market-filter border-0" data-auto-submit>
      {% for value, label in filter_form.fields.sort.choices %}<option value="{{ value }}" {% if filters.sort == value or not filters.sort and value == 'recommended' %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
</form>
{% if filter_form.errors %}<p class="text-b9 text-red-70" role="status">Some filter values were invalid and have been ignored. Please choose from the available options.</p>{% endif %}

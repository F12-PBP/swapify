{% load static %}
<div data-toast-region popover="manual" hidden aria-label="Notifications" class="fixed inset-auto right-4 bottom-4 z-[100] m-0 flex w-[calc(100%_-_2rem)] max-w-sm flex-col gap-3 overflow-visible border-0 bg-transparent p-0 sm:right-6 sm:bottom-6">
  <template data-toast-template>
    <div class="alert swap-alert items-start" data-toast>
      <span data-toast-icon aria-hidden="true" class="shrink-0 text-b7 font-semibold"></span>
      <p data-toast-text class="swap-alert-body min-w-0 flex-1 break-words"></p>
      <button type="button" data-toast-close aria-label="Dismiss notification" class="swap-alert-close flex size-6 shrink-0 items-center justify-center text-b7">×</button>
    </div>
  </template>
</div>
<script src="{% static 'main/js/toasts.js' %}" defer></script>

{% if user.is_authenticated %}
<a href="{% url 'user_profile:detail' %}" class="btn btn-primary-ghost w-37 gap-3 border-[1.6px]">My Profile</a>
<form method="post" action="{% url 'user_profile:logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary w-36 gap-3 text-neutral-20">Log Out</button>
</form>
{% else %}
<a href="{% url 'user_profile:login' %}" class="btn btn-primary-ghost w-37 gap-3 border-[1.6px]">Sign In</a>
<a href="{% url 'user_profile:register' %}" class="btn btn-primary w-36 gap-3 text-neutral-20">Sign Up</a>
{% endif %}

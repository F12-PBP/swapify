{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="swapify">
<head>
    {% tailwind_css %}
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Swapify
        {% endblock %}
    </title>
</head>

<body class="font-sans">
    {% include "components/navbar.html" %}

    <main class="lg:max-w-7xl md:max-w-5xl max-w-2xl w-full mx-auto min-h-screen pt-20">
        {% block content %}
        {% endblock %}
    </main>
    {% include "components/footer.html" %}
</body>
</html>

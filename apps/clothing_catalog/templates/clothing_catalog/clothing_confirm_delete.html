{% extends "marketplace/base.html" %}

{% block title %}Delete Clothing{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl">
    <div class="card border border-error/30 bg-base-100 shadow-sm">
        <div class="card-body gap-5">
            <h1 class="font-display text-h4">Delete clothing?</h1>
            <p>You are about to delete <strong>{{ clothing.name }}</strong> from the catalog. This action cannot be undone.</p>
            <form method="post" class="card-actions justify-end">
                {% csrf_token %}
                <a class="btn btn-ghost" href="{{ clothing.get_absolute_url }}">Cancel</a>
                <button class="btn btn-error" type="submit">Delete clothing</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Delete Clothing{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl px-4 py-10 md:px-6">
    <div class="rounded-box border border-red-30 bg-base-100 p-6 shadow-[0_4px_24px_rgb(115_20_29_/_6%)]">
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-red-base">Permanent action</p>
        <h1 class="font-display text-h4 text-primary-80">Delete clothing?</h1>
        <p class="mt-4 text-base-content/70">You are about to delete <strong>{{ clothing.name }}</strong> from the catalog. This action cannot be undone.</p>
        <form method="post" class="mt-6 flex flex-wrap justify-end gap-3">
            {% csrf_token %}
            <a class="btn btn-neutral" href="{{ clothing.get_absolute_url }}">Cancel</a>
            <button class="btn btn-error" type="submit">Delete clothing</button>
        </form>
    </div>
</section>
{% endblock %}

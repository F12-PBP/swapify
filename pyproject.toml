[tool.ruff]
target-version = "py313"
line-length = 88
force-exclude = true
extend-exclude = [
    "env",
    "venv",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "theme"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
